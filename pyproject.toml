[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-monitor-pbp"
version = "0.1.0"
description = "Switch LG monitors between Picture-by-Picture and full screen over RS-232C, with Wayland/niri output handling."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Davalillo" }]
keywords = [
    "lg",
    "monitor",
    "pbp",
    "picture-by-picture",
    "rs232",
    "serial",
    "wayland",
    "niri",
    "display-layout",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/davalillo/lg-monitor-pbp"
Repository = "https://github.com/davalillo/lg-monitor-pbp"
Issues = "https://github.com/davalillo/lg-monitor-pbp/issues"

[project.scripts]
lg-mode = "lg_mode:main"

[tool.setuptools]
py-modules = ["lg_mode", "lg_serial_probe"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
